<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="cv" width="1080" height="1920"></canvas>
<img id="LOGO" src="logo.png"><img id="VF"><img id="PRS">
<script>
const C=document.getElementById('cv'),X=C.getContext('2d');
const LOGO=document.getElementById('LOGO'), VF=document.getElementById('VF');
const W=1080,H=1920;
/* ── الألوان والخط تجي من theme.json — لا تكتب لوناً ثابتاً هني ── */
let BG='#F3EFEA',INK='#1F1F1D',ACC='#D97757',CLAY='#BD5D3A',MUT='#8A847A',FONT='Cairo',HANDLE='@handle';
let FACE_ANCH=0.30;   /* أين يقع وجه المتحدث داخل كرت الفيديو: 0 = فوق · 1 = تحت (theme.json ← faceAnchor) */
let CAPS=[],VEND=0,OUTRO=0,DUR=0;
function init(d){
  _BTC={}; _CHK={};
  CAPS=d.cards;VEND=d.total;OUTRO=d.outro;DUR=VEND+OUTRO;
  BEHIND=d.behind||null;
  MARKS=d.marks||[];
  const t=d.theme||{};
  BG=t.bg||BG; INK=t.ink||INK; ACC=t.acc||ACC; CLAY=t.clay||CLAY; MUT=t.mut||MUT;
  FONT=t.font?(/\s/.test(t.font)?'"'+t.font+'"':t.font):FONT;
  if(t.fontDisplay) FONTD=t.fontDisplay;
  if(t.fontText) FONTT=t.fontText; HANDLE=t.handle||HANDLE;
  if(typeof t.faceAnchor==='number') FACE_ANCH=t.faceAnchor;
  if(typeof t.faceTop==='number') FACE_TOP=t.faceTop;
  /* مقاسات الهوية — دليل البراند هو المرجع، لا أرقامنا */
  if(t.captionSize) {FS=t.captionSize; LH=Math.round(FS*1.44);}
  if(t.captionMaxW) MAXW=t.captionMaxW;
  if(t.maxLines)    MAXLINES=t.maxLines;
  if(t.safeTop)     BADGE_Y=t.safeTop+10;
  if(t.handleSize)  HANDLE_FS=t.handleSize;
  if(t.captionWeight) CW=String(t.captionWeight);
  if(t.sky)   SKY=t.sky;
  if(t.warm)  WARM=t.warm;
  if(t.cream) CREAM=t.cream;
  if(t.logo){const L=document.getElementById('LOGO'); if(L.getAttribute('src')!==t.logo) L.src=t.logo;}
  /* خط الهوية غالباً مثبّت بالنظام (خط تجاري مثلاً) — عندها ما نطلبه من قوقل */
  if(!t.fontLocal && FONT!=='Cairo'){const l=document.createElement('link');l.rel='stylesheet';
    l.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(FONT)+':wght@400;700&display=swap';
    document.head.appendChild(l);}
}
/* ---------- utils ---------- */

/* ═══ النظام الطباعي — الخط فيه 5 أوزان و3 عائلات. البولد لكل شي كان غلط. ═══ */
let FONTD=FONT, FONTT=FONT;   /* عائلة وحدة داخل الرسمة (القاعدة ٣٨) — لو عنده خط عناوين غيره، حطه بـtheme.fontDisplay */
/* ⛔ FONT يجي من init() مقتبساً أصلاً — الاقتباس مرتين يعطي ""اسم""
   وهو غير صالح بـCSS، فيسقط الخط كله للافتراضي بحجم 10px.
   هذي كانت سبب صغر كل النصوص الجديدة. */
const FQ=f=>(/^\s*["']/.test(f)||!/\s/.test(f))?f:'"'+f+'"';
/* الوزن هو التدرّج: رقم 900 · عنوان 700 · قيمة 700 · وصف 500 — لا تكتب وزناً بيدك */
function FT(kind,px){
  switch(kind){
    case 'num':   return '900 '+px+'px '+FQ(FONT);    /* رقم — الرقمي الأثقل */
    case 'head':  return '700 '+px+'px '+FQ(FONTD);   /* عنوان — للعناوين */
    case 'body':  return '500 '+px+'px '+FQ(FONTT);   /* نصّ ممتد — للنصوص */
    case 'value': return '700 '+px+'px '+FQ(FONT);    /* قيمة بواجهة */
    case 'label': return '500 '+px+'px '+FQ(FONT);    /* وصف بواجهة */
    case 'sub':   return '400 '+px+'px '+FQ(FONT);
    default:      return '300 '+px+'px '+FQ(FONT);
  }
}

/* ألوان مشتقّة من الثيم — لا تكتب rgba ثابتة */
function hx(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function rgba(hex,a){const c=hx(hex);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function lum(hex){const c=hx(hex).map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});
  return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];}
const cBG=a=>rgba(BG,a), cINK=a=>rgba(INK,a);
const onACC=()=>lum(ACC)>0.45?INK:'#FFFFFF';
const DARK=()=>lum(BG)<0.4;

const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const ease=t=>1-Math.pow(1-t,3);
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const back=t=>{const c=1.9,s=c+1;return 1+s*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const pr=(t,a,b)=>cl((t-a)/(b-a),0,1);
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();}
function sh(b,y,a){X.shadowColor=cINK(a);X.shadowBlur=b;X.shadowOffsetY=y;}
function nsh(){X.shadowColor='transparent';X.shadowBlur=0;X.shadowOffsetY=0;}
function card(x,y,w,h,r,al){X.save();X.globalAlpha*=(al===undefined?1:al);sh(44,18,0.20);X.fillStyle=cBG(0.97);rr(x,y,w,h,r);X.fill();nsh();X.strokeStyle=cINK(0.09);X.lineWidth=2.5;rr(x,y,w,h,r);X.stroke();X.restore();}
/* كل نص يُرسم يسجّل صندوقه لما يشتغل جامع التشخيص — فاحص التداخل يقرأها.
   ⛔ لازم نطبّق مصفوفة التحويل الحالية: العناصر المدوّرة أو المنقولة (كفّة ميزان مثلاً)
   تُرسم بإحداثيات محلية، وتسجيلها خاماً يعطي «تراكب ١٠٠٪» كاذباً. */
let _TBOX=[];
function T(s,x,y,f,c,al,dir){
  X.save();X.font=f;X.fillStyle=c;X.textAlign=al||'center';X.textBaseline='middle';
  if(dir)X.direction=dir;
  if(window.__collect){
    const m=X.measureText(String(s));
    const w=m.width, h=(m.actualBoundingBoxAscent||0)+(m.actualBoundingBoxDescent||0)||parseInt(f)*0.8;
    const a=al||'center';
    const lx = a==='right' ? x-w : a==='left' ? x : x-w/2;
    const ly = y-h/2;
    const M=X.getTransform();
    const pt=(px,py)=>({x:M.a*px+M.c*py+M.e, y:M.b*px+M.d*py+M.f});
    const cs=[pt(lx,ly),pt(lx+w,ly),pt(lx,ly+h),pt(lx+w,ly+h)];
    const xs=cs.map(p=>p.x), ys=cs.map(p=>p.y);
    const X0=Math.min(...xs), X1=Math.max(...xs), Y0=Math.min(...ys), Y1=Math.max(...ys);
    _TBOX.push({x:X0,y:Y0,w:X1-X0,h:Y1-Y0,t:String(s)});
  }
  X.fillText(s,x,y);X.restore();}
/* ---------- video staging ---------- */
/* ⛔ الوجه هو البطل — يبقى كبيراً وبالنص. القاعدة اللي تعلّمناها بالتجربة:
   وجه صغير بأعلى الشاشة يحوّل التركيز للنص، ويصير الفيديو خلفية لكلامه بدل ما يكون هو.
   عشان كذا كل المستطيلات هنا مركزها البصري ≈ 960 (نص الشاشة)، وأصغرها يغطي ٤٢٪ من الارتفاع.
   والرسومات ما تحتاج منطقة فاضية — ترسم **فوق** الفيديو (شوف overlayZone تحت). */
/* ⛔ ثلاث حالات لا رابع لها — الرسم ما يجي فوق وجه المتحدث أبداً.
   جرّبنا الرسم داخل كرت الفيديو فطلع يزاحم وجهه والكابشن معاً، والمستخدم رفضه. */
const R_FULL={x:0,y:0,w:1080,h:1920,r:0};    /* كلام صافي — ولا رسم فوقه */
const R_CARD={x:60,y:600,w:960,h:625,r:48};  /* الفيديو ينسحب تحت والرسم فوقه */
const R_NONE={x:540,y:820,w:0,h:0,r:48};     /* الوجه يختفي — للرسم الكبير (مرتين لكل دقيقتين) */
/* ⛔ «تصغير كامل بلا قص» — لصنّاع يدمجون البي-رول بالمصدر نفسه (صور · لقطات).
   القص العادي يبتر صورهم؛ هذي تصغّر الفريم كامل ويبان كل اللي فيه. */
const R_FIT ={x:258,y:170,w:564,h:1002,r:44,fit:true};


const SCENES=[     /* ⛔ أعد كتابته لكل فيديو — كل مشهد فيه رسم لازم R_CARD أو R_NONE.
                      R_FULL معناها «ما فيه رسم بهاللحظة». */
 {s:0.00, e:999, m:R_FULL}];
const TR=0.46;     /* مدة الانتقال بين الحالات */
function vrect(t){
  let i=SCENES.findIndex(s=>t>=s.s&&t<s.e); if(i<0)i=SCENES.length-1;
  let a=SCENES[i].m,b=a,k=1;
  if(t<SCENES[i].s+TR&&i>0){a=SCENES[i-1].m;b=SCENES[i].m;k=eio(pr(t,SCENES[i].s,SCENES[i].s+TR));}
  return {x:lerp(a.x,b.x,k),y:lerp(a.y,b.y,k),w:lerp(a.w,b.w,k),h:lerp(a.h,b.h,k),r:lerp(a.r,b.r,k),
          fit:(k>0.5?b:a).fit};
}

/* منطقة الرسم — تُحسب من حالة العرض، لا تحسبها بيدك */
function overlayZone(t){
  const R=vrect(t);
  /* الوجه مختفٍ → الرسم ياخذ الشاشة · الوجه بكرت → الرسم فوقه (تحت الشارة) */
  if(R.w<2)   return {x:60, y:320, w:960, h:820};
  if(R.r>0.5) return {x:60, y:300, w:960, h:Math.max(140,R.y-40-300)};
  return {x:60, y:880, w:840, h:220};        /* ملء الشاشة: شريحة تحت وجهه (نادراً) */
}
function drawVideo(t){
  const R=vrect(t); if(R.w<2||R.h<2) return;
  const sw=VF.naturalWidth||1080, shh=VF.naturalHeight||1920;
  /* fit = الفريم كامل داخل النافذة (بلا قص) · غير كذا = يملأها ويُقصّ */
  const FIT=!!R.fit;
  const sc=FIT?Math.min(R.w/sw,R.h/shh):Math.max(R.w/sw,R.h/shh);
  const cw=Math.min(sw,R.w/sc), ch=Math.min(shh,R.h/sc);
  const sx=(sw-cw)/2, sy=FIT?(shh-ch)/2:(shh-ch)*FACE_ANCH;
  const dw=cw*sc, dh=ch*sc, dx=R.x+(R.w-dw)/2, dy=R.y+(R.h-dh)/2;
  X.save();
  if(R.r>0.5){sh(70,26,0.26);X.fillStyle='#000';rr(R.x,R.y,R.w,R.h,R.r);X.fill();nsh();}
  rr(R.x,R.y,R.w,R.h,R.r);X.clip();
  X.drawImage(VF,sx,sy,cw,ch,dx,dy,dw,dh);
  X.restore();
  if(R.r>0.5){X.save();X.strokeStyle=cINK(0.10);X.lineWidth=3;rr(R.x,R.y,R.w,R.h,R.r);X.stroke();X.restore();}
}
/* ---------- icons ---------- */
function iCaption(x,y,s,c){X.save();X.strokeStyle=c;X.lineWidth=s*0.09;X.lineCap='round';
  rr(x-s/2,y-s*0.38,s,s*0.76,s*0.18);X.stroke();
  X.beginPath();X.moveTo(x-s*0.28,y-s*0.06);X.lineTo(x+s*0.28,y-s*0.06);X.moveTo(x-s*0.28,y+s*0.14);X.lineTo(x+s*0.06,y+s*0.14);X.stroke();X.restore();}
function iZoom(x,y,s,c){X.save();X.strokeStyle=c;X.lineWidth=s*0.09;X.lineCap='round';
  X.beginPath();X.arc(x-s*0.06,y-s*0.06,s*0.3,0,7);X.stroke();
  X.beginPath();X.moveTo(x+s*0.16,y+s*0.16);X.lineTo(x+s*0.36,y+s*0.36);X.stroke();
  X.beginPath();X.moveTo(x-s*0.2,y-s*0.06);X.lineTo(x+s*0.08,y-s*0.06);X.moveTo(x-s*0.06,y-s*0.2);X.lineTo(x-s*0.06,y+s*0.08);X.stroke();X.restore();}
function iCut(x,y,s,c){X.save();X.strokeStyle=c;X.lineWidth=s*0.085;X.lineCap='round';
  X.beginPath();X.arc(x-s*0.2,y+s*0.26,s*0.12,0,7);X.arc(x+s*0.2,y+s*0.26,s*0.12,0,7);X.stroke();
  X.beginPath();X.moveTo(x-s*0.24,y+s*0.16);X.lineTo(x+s*0.22,y-s*0.34);X.moveTo(x+s*0.24,y+s*0.16);X.lineTo(x-s*0.22,y-s*0.34);X.stroke();X.restore();}
function iSpark(x,y,s,c){X.save();X.strokeStyle=c;X.lineWidth=s*0.10;X.lineCap='round';
  for(let i=0;i<8;i++){const a=i*Math.PI/4,r0=s*0.10,r1=s*(i%2?0.28:0.40);
    X.beginPath();X.moveTo(x+Math.cos(a)*r0,y+Math.sin(a)*r0);X.lineTo(x+Math.cos(a)*r1,y+Math.sin(a)*r1);X.stroke();}
  X.fillStyle=c;X.beginPath();X.arc(x,y,s*0.09,0,7);X.fill();X.restore();}
function iFile(x,y,s,c){X.save();X.strokeStyle=c;X.lineWidth=s*0.085;X.lineJoin='round';
  X.beginPath();X.moveTo(x-s*0.28,y-s*0.4);X.lineTo(x+s*0.1,y-s*0.4);X.lineTo(x+s*0.28,y-s*0.2);X.lineTo(x+s*0.28,y+s*0.4);X.lineTo(x-s*0.28,y+s*0.4);X.closePath();X.stroke();
  X.beginPath();X.moveTo(x+s*0.1,y-s*0.4);X.lineTo(x+s*0.1,y-s*0.2);X.lineTo(x+s*0.28,y-s*0.2);X.stroke();X.restore();}
function iCloud(x,y,s,c){X.save();X.fillStyle=c;
  X.beginPath();X.arc(x-0.23*s,y+0.03*s,0.20*s,0,7);X.fill();
  X.beginPath();X.arc(x+0.02*s,y-0.11*s,0.28*s,0,7);X.fill();
  X.beginPath();X.arc(x+0.27*s,y+0.05*s,0.17*s,0,7);X.fill();
  rr(x-0.43*s,y+0.03*s,0.87*s,0.20*s,0.10*s);X.fill();X.restore();}
function iCheck(x,y,s,c,k){X.save();X.strokeStyle=c;X.lineWidth=s*0.13;X.lineCap='round';X.lineJoin='round';
  const p=[[-0.32,0.02],[-0.08,0.26],[0.34,-0.26]];X.beginPath();X.moveTo(x+p[0][0]*s,y+p[0][1]*s);
  if(k<0.5){const q=k/0.5;X.lineTo(x+lerp(p[0][0],p[1][0],q)*s,y+lerp(p[0][1],p[1][1],q)*s);}
  else{X.lineTo(x+p[1][0]*s,y+p[1][1]*s);const q=(k-0.5)/0.5;X.lineTo(x+lerp(p[1][0],p[2][0],q)*s,y+lerp(p[1][1],p[2][1],q)*s);}
  X.stroke();X.restore();}
/* ---------- persistent chrome ---------- */
/* الحساب نزل جنب شريط التقدّم — يفرّغ كل المساحة فوق رأسه للرسم.
   بلا كبسولة: نصّ خفيف فوق الشريط مباشرة فما يزاحمه ولا يتداخل معه. */
function badge(t){
  let a=pr(t,0.25,0.7); if(t>VEND-0.3)a*=1-pr(t,VEND-0.3,VEND);
  if(a<=0)return; X.save();X.globalAlpha=a*0.92;
  const s=HANDLE, y=BAR_Y-22;
  X.font=FT('label',HANDLE_FS);
  X.direction='ltr';X.textAlign='left';X.textBaseline='alphabetic';
  X.shadowColor=cBG(0.85);X.shadowBlur=14;
  X.fillStyle=cINK(0.62);X.fillText(s,52,y);
  X.restore();}
function bar(t){let a=t>VEND-0.3?1-pr(t,VEND-0.3,VEND):1;if(a<=0)return;
  /* ⛔ 1560 لا 1492: كان يبعد ٣٢ بكسل عن الكابشن فيبان ملتصقاً به.
     ومن حافة لحافة بلا هوامش — خط إطار، مو عنصر يزاحم النص. */
  X.save();X.globalAlpha=a;const y=BAR_Y,h=6;
  X.fillStyle=cINK(0.13);X.fillRect(0,y,W,h);
  X.fillStyle=ACC;X.fillRect(0,y,W*cl(t/VEND,0,1),h);X.restore();}
/* ---------- captions ---------- */
let FS=55,LH=79,MAXW=730;const GAP=16,PADX=44,PADY=30;  /* 730: يخلي الكرت ينتهي قبل عمود أزرار انستقرام */
let MAXLINES=2, BADGE_Y=190, HANDLE_FS=28, CW='700', BAR_Y=1560;   /* ⛔ سطران كحد أقصى — الثالث يرفع الكرت على وجه المتحدث */
function layoutAt(ws,fs){X.font=CW+' '+fs+'px '+FONT;
  const it=ws.map(w=>({...w,w:X.measureText(w.t).width}));const L=[];let c=[],cw=0;
  for(const i of it){const add=c.length?i.w+GAP:i.w;
    if(cw+add>MAXW&&c.length){L.push({items:c,w:cw});c=[i];cw=i.w;}else{c.push(i);cw+=add;}}
  if(c.length)L.push({items:c,w:cw});return L;}
/* ⛔ المقاس ثابت لا يتغيّر — تغيّره بين جملة وجملة يكسر التناسق (ملاحظة المستخدم).
   الجملة اللي ما تدخل بسطرين تنقسم كرتين متتاليتين، وكل كرت ياخذ توقيت كلماته. */
function fitCaption(ws){ return {L:layoutAt(ws,FS), fs:FS, lh:LH}; }
function layout(ws){return layoutAt(ws,FS);}
let _CHK={};
function splitEven(ws,n){
  const out=[], per=Math.ceil(ws.length/n);
  for(let i=0;i<ws.length;i+=per) out.push(ws.slice(i,i+per));
  return out;
}
/* ⛔ التقسيم متوازن: نحسب أقل عدد قطع يدخل كلها بسطرين، ثم نوزّع الكلمات
   بالتساوي. الطريقة الجشعة (املأ ثم اكسر) كانت تخلّف كلمة وحيدة بكرت كامل. */
function chunksFor(ci,ws){
  if(_CHK[ci]) return _CHK[ci];
  let n=1, parts=[ws];
  while(n<ws.length){
    parts=splitEven(ws,n);
    if(parts.every(p=>layoutAt(p,FS).length<=MAXLINES)) break;
    n++;
  }
  _CHK[ci]=parts; return parts;
}
function caption(t){
  /* لا تكرّر: لو الكلام يمرّ ورا الشخص بهاللحظة، كرت الكابشن يختفي */
  if(BEHIND&&PRS_OK&&vrect(t).r<=0.5&&BEHIND.lines.some(l=>t>=l.s&&t<=l.e)) return;
  const ci=CAPS.findIndex(c=>t>=c.s&&t<c.e); if(ci<0)return;
  const c0=CAPS[ci], parts=chunksFor(ci,c0.w);
  /* القطعة النشطة: اللي وقتها يشمل t (وآخر قطعة تمتد لنهاية الكرت) */
  let pi=0;
  for(let i=0;i<parts.length;i++){ if(t>=parts[i][0].s) pi=i; }
  const seg=parts[pi];
  const c={s:pi===0?c0.s:seg[0].s-0.06,

/* شريط مراحل: دوائر تتحوّل لعلامة صح، وخط يمتد يسار←يمين */

  X.fillStyle=g; rr(x,y,w,h,r); X.fill();

/* خط موصّل بزوايا مدوّرة وعُقد — يرسم نفسه تدريجياً مع k */
function routeLine(pts,k,o){
  o=o||{}; k=cl(k,0,1); if(k<=0) return;
  const R=o.r||26, col=o.color||ACC;
  /* الطول الكلي لتوزيع التقدّم */
  let segs=[],tot=0;
  for(let i=1;i<pts.length;i++){
    const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
    segs.push(d); tot+=d;
  }
  let want=tot*k;
  X.save();
  X.shadowColor=rgba(col,0.85);X.shadowBlur=o.blur||18;
  X.strokeStyle=col;X.lineWidth=o.lw||4;X.lineCap='round';X.lineJoin='round';
  X.beginPath();X.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length && want>0;i++){
    const [px,py]=pts[i-1],[cx,cy]=pts[i];
    const d=segs[i-1], f=Math.min(1,want/d);
    const nx=px+(cx-px)*f, ny=py+(cy-py)*f;
    if(f<1 || i===pts.length-1){ X.lineTo(nx,ny); }
    else { const [ax,ay]=pts[i+1]||pts[i];
      X.arcTo(cx,cy,ax,ay,R); }
    want-=d;
  }
  X.stroke();nsh();
  /* عُقد على المفاصل اللي وصلها الخط */
  if(o.nodes!==false){
    let acc=0;
    for(let i=0;i<pts.length;i++){
      if(i>0) acc+=segs[i-1];
      if(acc>tot*k+1) break;
      X.fillStyle=col;X.beginPath();X.arc(pts[i][0],pts[i][1],o.nr||9,0,7);X.fill();
    }
  }
  X.restore();
}

/* ⑧ مسار متعرّج بمحطات — للرحلة والمراحل. */

/* ㉑ الحيّز فوق رأسه — رسم فوق الفيديو الكامل بلا نافذة ولا مساس بالوجه.
   حدوده تُحسب من كاشف الوجه (theme.faceTop) لا برقم ثابت. */
let FACE_TOP=603;
function headroomZone(){
  const top=200;   /* الحساب نزل تحت — المساحة كلها متاحة */
  return {x:60, y:top, w:960, h:Math.max(120, FACE_TOP-38-top)};
}

/* ㉒ مربّع ينهار — يكتمل، تُكتب التوقّعات بوسطه، ثم تتفكّك أضلاعه وتطيح */
function collapseBox(cx,cy,r,items,t,o){
  o=o||{};
  const n=items.length, R0=o.rot!==undefined?o.rot:-Math.PI*0.75, P=[];
  for(let i=0;i<n;i++){ const a=R0+i*2*Math.PI/n;
    P.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r]); }

/* ⑮ مثلث يكتمل ضلعاً ضلعاً — لثلاث مراحل تقفل على نفسها */
function triCycle(cx,cy,r,items,t,rot){
  const n=items.length, P=[];
  const R0=(rot!==undefined?rot:-Math.PI/2);
  for(let i=0;i<n;i++){ const a=R0+i*2*Math.PI/n;

  X.save();
  X.strokeStyle=rgba(SKY,0.13); X.lineWidth=3; X.lineJoin='round';
  X.beginPath(); P.forEach((p,i)=>i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1])); X.closePath(); X.stroke();
  /* كل ضلع يُرسم بين نقطتيه */
  X.strokeStyle=ACC; X.lineWidth=6; X.lineCap='round'; X.lineJoin='round';
  X.shadowColor=rgba(ACC,0.5); X.shadowBlur=12;
  /* ⛔ الضلع الأخير يرجع لنقطة البداية — مدّته من وقته الخاص، لا من وقت النقطة الأولى
     (كان b < a فيطلع تقدّماً سالباً وتتلخبط الحركة). */
  const CLOSE=items[n-1].s+1.10;
  for(let i=0;i<n;i++){
    const a=items[i].s, b=(i<n-1)? items[i+1].s : CLOSE;

    const p0=P[i], p1=P[(i+1)%n];

    X.lineTo(lerp(p0[0],p1[0],k), lerp(p0[1],p1[1],k)); X.stroke();
  }
  nsh();
  items.forEach((it,i)=>{
    /* النقطة الأولى تُنوَّر ثانيةً لمّا يقفل المثلث — الحلقة رجعت لبدايتها */
    const on=t>=it.s, live=(on&&t<it.s+0.9)||(i===0&&t>=CLOSE);
    const kk=eio(cl(pr(t,it.s,it.s+0.28),0,1));

    if(live){X.shadowColor=rgba(ACC,0.9);X.shadowBlur=20;}
    X.fillStyle=on?(live?WARM:ACC):rgba(SKY,0.16);
    X.beginPath(); X.arc(P[i][0],P[i][1],live?22:16,0,7); X.fill(); nsh();

      '700 34px '+FONT, on?CREAM:rgba(SKY,0.55));
    X.restore();
  });
  X.restore();

  let done=0; for(const it of items) if(t>=it.s) done++;
  const k=cl(done/n + (done<n? cl((t-(items[done]?items[done].s:0)+0.6)/0.6,0,1)/n*0 :0),0,1);
  if(done>0){
    X.strokeStyle=ACC; X.lineWidth=6; X.lineCap='round';
    X.shadowColor=rgba(ACC,0.5); X.shadowBlur=14;
    X.beginPath(); X.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*(done/n)); X.stroke(); nsh();
  }
  items.forEach((it,i)=>{
    const a=-Math.PI/2+Math.PI*2*i/n, px=cx+Math.cos(a)*r, py=cy+Math.sin(a)*r;
    const on=t>=it.s, live=on&&t<it.s+1.0;
    const kk=eio(cl(pr(t,it.s,it.s+0.30),0,1));
    X.save(); X.globalAlpha*=on?1:0.4;
    if(live){X.shadowColor=rgba(ACC,0.9);X.shadowBlur=22;}
    X.fillStyle=on?(live?WARM:ACC):rgba(SKY,0.18);
    X.beginPath(); X.arc(px,py,live?26:20,0,7); X.fill(); nsh();
    const lx=cx+Math.cos(a)*(r+62), ly=cy+Math.sin(a)*(r+62);
    T(it.t, lx, ly+9, '700 34px '+FONT, on?CREAM:rgba(SKY,0.6));
    X.restore();
  });
  /* رأس السهم يرجع لنقطة البداية = الحلقة ما تنتهي */
  if(done>=n){
    const a=-Math.PI/2+0.22, px=cx+Math.cos(a)*r, py=cy+Math.sin(a)*r;
    X.save(); X.translate(px,py); X.rotate(a+Math.PI/2);
    X.fillStyle=WARM; X.beginPath();
    X.moveTo(0,-16); X.lineTo(13,12); X.lineTo(-13,12); X.closePath(); X.fill();
    X.restore();
  }
  X.restore();
}

/* ═══ مخطط خطّي خفيف — نقاط تتصل بخط يتقدّم يسار←يمين ═══
   pts = [{x:0..1, y:0..1, s:وقت_وصول_النقطة, t:'ملصق'}]  · y=0 أعلى القيمة
   يرسم شبكة خفيفة ومحاور، والخط يُرسم تدريجياً مع ظهور كل نقطة.  */
function lineChart(x,y,w,h,pts,t,o){
  o=o||{};
  const P=pts.map(p=>({...p, px:x+p.x*w, py:y+p.y*h}));
  X.save();
  /* شبكة خفيفة */
  X.strokeStyle=rgba(SKY,0.10); X.lineWidth=1.5;
  for(let i=0;i<=4;i++){ const gy=y+h*i/4;
    X.beginPath();X.moveTo(x,gy);X.lineTo(x+w,gy);X.stroke(); }
  /* المحوران */
  X.strokeStyle=rgba(SKY,0.28); X.lineWidth=2.5;
  X.beginPath();X.moveTo(x,y);X.lineTo(x,y+h);X.lineTo(x+w,y+h);X.stroke();

  /* كم نقطة وصلت، وأين الخط الآن بين النقطتين */
  let n=0; for(const p of P) if(t>=p.s) n++;
  let prog=0;
  if(n>0&&n<P.length) prog=cl((t-P[n-1].s)/Math.max(0.001,P[n].s-P[n-1].s),0,1);
  const path=P.slice(0,Math.max(n,1)).map(p=>[p.px,p.py]);
  if(n>0&&n<P.length&&prog>0)
    path.push([lerp(P[n-1].px,P[n].px,prog), lerp(P[n-1].py,P[n].py,prog)]);

  if(path.length>1){
    /* تعبئة خفيفة تحت الخط */
    X.save();
    const g=X.createLinearGradient(0,y,0,y+h);
    g.addColorStop(0,rgba(ACC,0.24)); g.addColorStop(1,rgba(ACC,0.02));
    X.fillStyle=g; X.beginPath(); X.moveTo(path[0][0],y+h);
    path.forEach(q=>X.lineTo(q[0],q[1]));
    X.lineTo(path[path.length-1][0],y+h); X.closePath(); X.fill();
    X.restore();
    /* الخط نفسه */
    X.strokeStyle=ACC; X.lineWidth=5; X.lineJoin='round'; X.lineCap='round';
    X.shadowColor=rgba(ACC,0.55); X.shadowBlur=14;
    X.beginPath(); X.moveTo(path[0][0],path[0][1]);
    for(let i=1;i<path.length;i++) X.lineTo(path[i][0],path[i][1]);
    X.stroke(); nsh();
    /* رأس الخط */
    const hd=path[path.length-1];
    X.fillStyle=WARM; X.beginPath(); X.arc(hd[0],hd[1],9,0,7); X.fill();
  }
  /* النقاط الواصلة وملصقاتها */
  P.forEach((p,i)=>{
    if(t<p.s) return;
    const k=eio(cl(pr(t,p.s,p.s+0.30),0,1)), live=t<p.s+0.9;
    X.save(); X.globalAlpha*=k;
    if(live){X.shadowColor=rgba(ACC,0.9);X.shadowBlur=20;}
    X.fillStyle=live?WARM:ACC;
    X.beginPath(); X.arc(p.px,p.py,live?11:7,0,7); X.fill(); nsh();
    if(p.t) T(p.t, p.px, p.py-30, '700 32px '+FONT, live?CREAM:rgba(SKY,0.85));
    X.restore();
  });
  if(o.yTop)  T(o.yTop, x-16, y+8,     '700 26px '+FONT, rgba(SKY,0.7),'right');
  if(o.yBot)  T(o.yBot, x-16, y+h+8,   '700 26px '+FONT, rgba(SKY,0.7),'right');
  if(o.xLab)  T(o.xLab, x+w, y+h+46,   '700 28px '+FONT, SKY,'right');
  X.restore();
}

/* ═══ نمطان مجرَّبان — الاقتباس والمقارنة الحيّة ═══ */

/* صفحة كتاب: للاقتباس أو الجملة اللي تستاهل معاملة خاصة.
   استعملها بلحظة R_NONE، وأخفِ الكابشن العادي طولها حتى ما يتكرر النص.
   lines = [{t:'السطر', s:وقت_ظهوره}, …]  — آخر سطر يطلع بلون التمييز (الزبدة). */
function quotePage(t,s0,s1,lines,opt){
  opt=opt||{};
  const a=ease(pr(t,s0,s0+0.50))*(1-pr(t,s1-0.55,s1));
  if(a<=0) return;
  const pw=opt.w||880, ph=opt.h||720, px=540-pw/2, py=opt.y||330;
  const k=pr(t,s0,s0+0.65);
  X.save();X.globalAlpha=a;
  X.translate(540,py+ph/2);X.scale(lerp(0.92,1,back(k)),lerp(0.92,1,back(k)));
  X.translate(-540,-(py+ph/2));
  sh(46,20,0.34);X.fillStyle=INK;rr(px,py,pw,ph,26);X.fill();nsh();   /* الصفحة فاتحة */
  X.fillStyle=rgba(ACC,0.9);rr(px+pw-22,py,22,ph,11);X.fill();        /* كعب الكتاب */
  X.fillStyle=rgba(BG,0.07);
  for(let i=0;i<8;i++){rr(px+70,py+140+i*66,pw-190,3,2);X.fill();}    /* سطور خافتة */
  T('”',px+pw-96,py+128,'700 170px '+FONT,rgba(ACC,0.45));
  T('“',px+100,py+ph-104,'700 170px '+FONT,rgba(ACC,0.45));
  /* الأسطر تُوسَّط عمودياً — كان فيه فراغ فوق والسطور ملصوقة تحت */
  const step=Math.min(150,(ph-190)/Math.max(1,lines.length));
  const top=py+(ph-step*(lines.length-1))/2-26;
  lines.forEach((q,i)=>{
    const kk=ease(pr(t,q.s,q.s+0.55)); if(kk<=0) return;
    const last=i===lines.length-1, fs=last?72:62;
    X.save();X.globalAlpha=a*kk;
    const yy=top+i*step+(1-kk)*18;
    X.font='700 '+fs+'px '+FONT;
    const words=q.t.split(' ');let line=[],L=[],cw=0;
    for(const wd of words){const ww=X.measureText(wd+' ').width;
      if(cw+ww>pw-230&&line.length){L.push(line.join(' '));line=[wd];cw=ww;}
      else{line.push(wd);cw+=ww;}}
    if(line.length) L.push(line.join(' '));
    L.forEach((ln,li)=>T(ln,540,yy+li*Math.round(fs*1.90),'700 '+fs+'px '+FONT,last?CLAY:rgba(BG,0.88)));
    X.restore();
  });
  X.restore();
}

/* مقارنة حيّة: المنطوقة تنوّر وتكبر والثانية تخفت — الحركة تشرح كلامه لا تزيّنه.
   items = [{t:'معلومة', s:وقت_الدخول, on:[بداية,نهاية], icon:'check'|'cross', x:-1|+1}] */
function livePair(t,s0,s1,items){
  const a=ease(pr(t,s0,s0+0.45))*(1-pr(t,s1-0.55,s1));
  if(a<=0) return;
  const Z=overlayZone(t), y=Z.y+Z.h*0.52;
  X.save();X.globalAlpha=a;
  items.forEach(it=>{
    const k=pr(t,it.s,it.s+0.42); if(k<=0) return;
    const live=t>=it.on[0]&&t<it.on[1];
    const pop=live?1+0.10*Math.sin(Math.PI*cl((t-it.on[0])/0.55,0,1)):1;
    const dim=(!live&&t>=it.on[1])?0.42:1;
    X.save();X.globalAlpha=a*ease(k)*dim;
    const cx=540+it.x*230, dy=(1-ease(k))*24;
    X.translate(cx,y+dy);X.scale(pop,pop);X.translate(-cx,-(y+dy));
    X.font='700 44px '+FONT;
    const tw=X.measureText(it.t).width, d=56, gap=16, pad=30, w=d+gap+tw+pad*2, h=110;
    if(live){X.save();X.globalAlpha=a*0.55;
      X.shadowColor=rgba(ACC,0.9);X.shadowBlur=34;X.fillStyle=ACC;
      rr(cx-w/2,y-h/2+dy,w,h,h/2);X.fill();nsh();X.restore();}
    sh(24,10,0.24);
    X.fillStyle=live?ACC:rgba(INK,0.10);rr(cx-w/2,y-h/2+dy,w,h,h/2);X.fill();nsh();
    if(!live){X.strokeStyle=rgba(INK,0.30);X.lineWidth=2.5;rr(cx-w/2,y-h/2+dy,w,h,h/2);X.stroke();}
    const col=live?onACC():INK, ix=cx-w/2+pad+d/2, q=cl((t-it.s)/0.4,0,1);
    T(it.t,cx+d/2+gap/2,y+2+dy,'700 44px '+FONT,col);
    if(it.icon==='check') iCheck(ix,y+dy,d*0.8,col,q);
    else{X.save();X.strokeStyle=col;X.lineWidth=d*0.11;X.lineCap='round';
      const r=d*0.26;
      X.beginPath();X.moveTo(ix-r,y-r+dy);X.lineTo(ix-r+2*r*q,y-r+2*r*q+dy);
      X.moveTo(ix+r,y-r+dy);X.lineTo(ix+r-2*r*q,y-r+2*r*q+dy);X.stroke();X.restore();}
    X.restore();
  });
  X.restore();
}


/* ⑳ تحديد ذكي على لقطة — إطار يلتف على نصّ اكتشفه Vision بموقعه الحقيقي.
   ⛔ يُستعمل فقط على لقطات ثابتة نظيفة (لقطات تطبيق مثلاً)، لا على صور فيها نصّ مطبوع.
   MARKS تجي من marks.json — الموقع محسوب من الصورة نفسها لا مضبوط يدوياً. */
let MARKS=[];
function markBox(t){
  /* ⛔ بلا أي حركة: يظهر ويختفي مع الصورة بوم. اللقطة ثانية أو ثانيتين
     فالإطار المتحرّك ما يلحقها، وكان يتسرّب لفريمات يظهر فيها المتحدث. */
  for(const m of MARKS){
    if(t<m.a||t>=m.b) continue;
    const pad=20, x=m.x-pad, y=m.y-pad, w=m.w+pad*2, h=m.h+pad*2;
    X.save();
    X.save(); X.globalAlpha*=0.30; X.shadowColor=rgba(ACC,0.95); X.shadowBlur=26;
    X.fillStyle=ACC; rr(x,y,w,h,14); X.fill(); nsh(); X.restore();
    X.strokeStyle=WARM; X.lineWidth=5; rr(x,y,w,h,14); X.stroke();
    X.restore();
  }
}


/* ㉗ خط متعرّج يستقيم — «بطبّق كل اللي فيه وتتغير حياتي» */
function snakeToLine(x,y,w,k,o){
  o=o||{}; const amp=o.amp||58, n=o.n||5;
  const st=eio(cl(k,0,1));                     /* 0 = متعرّج · 1 = مستقيم */
  X.save();
  X.strokeStyle=ACC; X.lineWidth=7; X.lineCap='round'; X.lineJoin='round';
  X.shadowColor=rgba(ACC,0.55); X.shadowBlur=16;
  X.beginPath();
  for(let i=0;i<=120;i++){
    const u=i/120, px=x+w*u;
    const py=y+Math.sin(u*Math.PI*n)*amp*(1-st);
    i?X.lineTo(px,py):X.moveTo(px,py);
  }
  X.stroke(); nsh();
  /* رأس متقدّم */
  X.fillStyle=WARM; X.beginPath(); X.arc(x+w,y,11,0,7); X.fill();
  X.restore();
  if(o.a) T(o.a, x,      y-amp-46, FT('label',30), rgba(SKY,0.75),'left');
  if(o.b) T(o.b, x+w,    y-amp-46, FT('label',34), st>0.5?CREAM:rgba(SKY,0.55),'right');
}

/* ㉘ دوائر متداخلة بنصّ داخلها — بديل الشظايا */
function circleSet(cx,cy,items,t,s0,o){
  /* شبكة 2×2 من دوائر تتلامس — النصّ داخلها كبير ومقروء.
     الترتيب الشعاعي كان يكوّمها بالمركز فتطلع وردة لا أربعة مفاهيم. */
  o=o||{}; const R=o.r||210, gapX=R*1.62, gapY=R*1.58;
  const pos=[[-1,-1],[1,-1],[-1,1],[1,1]];
  X.save();
  X.globalCompositeOperation='lighter';
  items.forEach((it,i)=>{
    const kk=eio(cl(pr(t,s0+i*0.14,s0+0.60+i*0.14),0,1)); if(kk<=0) return;
    const px=cx+pos[i][0]*gapX/2, py=cy+pos[i][1]*gapY/2;
    const g=X.createRadialGradient(px,py,8,px,py,R);
    g.addColorStop(0,rgba(ACC,0.34*kk)); g.addColorStop(0.72,rgba(ACC,0.13*kk)); g.addColorStop(1,rgba(ACC,0));
    X.fillStyle=g; X.beginPath(); X.arc(px,py,R,0,7); X.fill();
  });
  X.globalCompositeOperation='source-over';
  items.forEach((it,i)=>{
    const kk=eio(cl(pr(t,s0+i*0.14,s0+0.60+i*0.14),0,1)); if(kk<=0) return;
    const px=cx+pos[i][0]*gapX/2, py=cy+pos[i][1]*gapY/2;
    X.save(); X.globalAlpha*=kk;
    X.strokeStyle=rgba(WARM,0.60); X.lineWidth=2.5;
    X.beginPath(); X.arc(px,py,R*0.80,0,7); X.stroke();
    const ws=it.t.split(' ');
    let lines=[it.t], fs=46;
    X.font=FT('value',fs);
    if(X.measureText(it.t).width > R*1.34 && ws.length>1){
      const h=Math.ceil(ws.length/2);
      lines=[ws.slice(0,h).join(' '), ws.slice(h).join(' ')]; fs=40;
    }
    lines.forEach((ln,li)=>
      T(ln, px, py+16+(li-(lines.length-1)/2)*(fs+26), FT('value',fs), CREAM));
    X.restore();
  });
  X.restore();
}

/* ㉙ جبل جليد مجسّم — قمة بوجهين وكتلة غاطسة بعمق */
function iceberg3D(cx,wl,w,ht,hb,k1,k2,o){
  /* جبل جليد: قمة حادّة بوجهين، وكتلة غاطسة تتّسع ثم تضيق لأسفل بأوجه.
     الشكل السداسي المنتظم كان يُقرأ صخرة لا جبلاً. */
  o=o||{};
  const tk=eio(cl(k1,0,1)), bk=eio(cl(k2,0,1));
  X.save();
  if(bk>0){
    X.save(); X.globalAlpha*=bk;
    const bh=hb*bk, W2=w*0.50*bk;
    const pts=[[-w*0.19,0],[w*0.19,0],[W2,bh*0.22],[w*0.30,bh*0.62],
               [w*0.10,bh*0.95],[-w*0.14,bh],[-w*0.36,bh*0.60],[-W2,bh*0.20]];
    const P=pts.map(q=>[cx+q[0],wl+q[1]]);
    const g=X.createLinearGradient(0,wl,0,wl+bh);
    g.addColorStop(0,rgba(ACC,0.58)); g.addColorStop(0.55,rgba(ACC,0.30)); g.addColorStop(1,rgba(ACC,0.08));
    X.fillStyle=g; X.beginPath();
    P.forEach((q,i)=>i?X.lineTo(q[0],q[1]):X.moveTo(q[0],q[1])); X.closePath(); X.fill();
    /* أوجه داخلية تعطي الحجم */
    X.strokeStyle=rgba('#FFFFFF',0.10); X.lineWidth=2;
    [[0,4],[1,5],[7,3]].forEach(e=>{ X.beginPath();
      X.moveTo(P[e[0]][0],P[e[0]][1]); X.lineTo(P[e[1]][0],P[e[1]][1]); X.stroke(); });
    X.strokeStyle=rgba(ACC,0.45); X.lineWidth=2.5;
    X.beginPath(); P.forEach((q,i)=>i?X.lineTo(q[0],q[1]):X.moveTo(q[0],q[1])); X.closePath(); X.stroke();
    X.restore();
  }
  if(tk>0){
    X.save(); X.globalAlpha*=tk;
    const th=ht*tk;
    X.shadowColor=rgba(WARM,0.60); X.shadowBlur=36;
    X.fillStyle=WARM; X.beginPath();
    X.moveTo(cx-w*0.02,wl-th); X.lineTo(cx+w*0.19,wl); X.lineTo(cx-w*0.19,wl);
    X.closePath(); X.fill(); nsh();
    X.fillStyle=rgba('#FFFFFF',0.24); X.beginPath();
    X.moveTo(cx-w*0.02,wl-th); X.lineTo(cx+w*0.19,wl); X.lineTo(cx+w*0.01,wl);
    X.closePath(); X.fill();
    X.restore();
  }
  X.strokeStyle=rgba(SKY,0.75); X.lineWidth=3.5; X.setLineDash([16,12]);
  X.beginPath(); X.moveTo(cx-w*0.80,wl); X.lineTo(cx+w*0.80,wl); X.stroke(); X.setLineDash([]);
  X.restore();
  if(o.up  &&tk>0.5) T(o.up,  cx, wl-ht-56, FT('head',42), rgba(SKY,0.92));
  if(o.num &&tk>0.5) T(o.num, cx, wl-ht*0.26, FT('num',92), CREAM);
  if(o.down&&bk>0.5) T(o.down,cx, wl+hb*0.56, FT('value',48), CREAM);
}

/* ㉚ أربعة مؤشّرات على سلّم واحد — «كلها راح تتحسّن» */
function levelSet(x,y,w,items,t,o){
  o=o||{};
  X.save();
  items.forEach((it,i)=>{
    const k=eio(cl(pr(t,it.s,it.s+0.42),0,1)); if(k<=0) return;
    const ty=y+i*112;
    X.save(); X.globalAlpha*=k;
    T(it.t, x+w, ty-6, FT('label',32), rgba(SKY,0.88),'right');
    /* سلّم من خمس درجات — الحالة الآن مقابل المتوقّع */
    const seg=(w-20)/5;
    for(let c=0;c<5;c++){
      const on=c<it.now;
      X.fillStyle=on?ACC:rgba(SKY,0.13);
      rr(x+c*(seg+4), ty+18, seg, 22, 11); X.fill();
    }
    /* السهم يقول إنها تتحسّن */
    const ak=ease(pr(t,(o.rise||1e9)+i*0.16,(o.rise||1e9)+0.5+i*0.16));
    if(ak>0){
      X.save(); X.globalAlpha*=ak;
      X.strokeStyle=WARM; X.lineWidth=4; X.lineCap='round';
      const ax=x+w-24, ay=ty+29;
      X.beginPath(); X.moveTo(ax-30,ay); X.lineTo(ax,ay); X.stroke();
      X.beginPath(); X.moveTo(ax-11,ay-9); X.lineTo(ax,ay); X.lineTo(ax-11,ay+9); X.stroke();
      X.restore();
    }
    X.restore();
  });
  X.restore();
}

/* ㉛ كيبورد حقيقي — ثلاثة صفوف ومسافة، وأزرار تحته */
function realKeyboard(x,y,w,t,A){
  const rows=[10,9,7], kh=52, gp=8;
  let ky=y;
  for(let r=0;r<3;r++){
    const cols=rows[r], kw=(w-gp*(cols-1))/cols;
    const off=x+(w-(cols*kw+gp*(cols-1)))/2;
    for(let c=0;c<cols;c++){
      const idx=r*10+c, lit=(Math.floor((t-A)*11)%26)===idx;
      X.save();
      X.fillStyle=lit?rgba(WARM,0.90):rgba(SKY,0.15);
      rr(off+c*(kw+gp), ky, kw, kh, 10); X.fill();
      X.restore();
    }
    ky+=kh+gp;
  }
  /* صفّ المسافة */
  const sw=w*0.46, sx=x+(w-sw)/2;
  X.save(); X.fillStyle=rgba(SKY,0.15); rr(sx,ky,sw,kh,10); X.fill();
  X.fillStyle=rgba(SKY,0.15); rr(x,ky,w*0.16,kh,10); X.fill();
  X.fillStyle=rgba(SKY,0.15); rr(x+w-w*0.16,ky,w*0.16,kh,10); X.fill();
  X.restore();
  return ky+kh;
}

/* ㉜ أزرار تفاعل بأيقونات — متابعة ونشر */
function actionButtons(cy,items,t){
  const bw=340, bh=104, gp=28;
  const tot=items.length*bw+(items.length-1)*gp, x0=540-tot/2;
  items.forEach((it,i)=>{
    const k=eio(cl(pr(t,it.s,it.s+0.42),0,1)); if(k<=0) return;
    const x=x0+i*(bw+gp);
    X.save(); X.globalAlpha*=k;
    X.translate(x+bw/2,cy);X.scale(lerp(0.90,1,k),lerp(0.90,1,k));X.translate(-(x+bw/2),-cy);
    if(it.hot){ sh(30,12,0.42); X.fillStyle=ACC; rr(x,cy-bh/2,bw,bh,bh/2); X.fill(); nsh(); }
    else      { glassPanel(x,cy-bh/2,bw,bh,bh/2,{hot:true}); }
    iconText(x+bw/2, cy, it.icon, it.t, FT('value',40), it.hot?CREAM:INK, 46, 20);
    X.restore();
  });
}
function iPlus(cx,cy,s,c){
  X.save();X.strokeStyle=c;X.lineWidth=s*0.15;X.lineCap='round';
  X.beginPath();X.moveTo(cx-s*0.32,cy);X.lineTo(cx+s*0.32,cy);
  X.moveTo(cx,cy-s*0.32);X.lineTo(cx,cy+s*0.32);X.stroke();X.restore();
}
function iShare(cx,cy,s,c){
  X.save();X.strokeStyle=c;X.lineWidth=s*0.13;X.lineCap='round';X.lineJoin='round';
  X.beginPath();X.moveTo(cx,cy+s*0.34);X.lineTo(cx,cy-s*0.30);
  X.moveTo(cx-s*0.22,cy-s*0.10);X.lineTo(cx,cy-s*0.34);X.lineTo(cx+s*0.22,cy-s*0.10);X.stroke();
  X.beginPath();X.moveTo(cx-s*0.34,cy+s*0.10);X.lineTo(cx-s*0.34,cy+s*0.40);
  X.lineTo(cx+s*0.34,cy+s*0.40);X.lineTo(cx+s*0.34,cy+s*0.10);X.stroke();X.restore();
}


/* ㉝ تقويم أسبوع — أيام مختصرة، المضيء منها يقول كم مرة */
function weekCal(cx,cy,onDays,k,o){
  o=o||{}; const D=['أحد','اثن','ثلا','أرب','خمي','جمع','سبت'];
  const cw=o.cw||88, gp=10, tot=7*cw+6*gp, x0=cx-tot/2;
  X.save();
  D.forEach((d,i)=>{
    const kk=eio(cl(pr(k,i*0.04,0.30+i*0.04),0,1)); if(kk<=0) return;
    const on=onDays.includes(i), x=x0+i*(cw+gp);
    X.save(); X.globalAlpha*=kk;
    if(on){ X.shadowColor=rgba(ACC,0.85); X.shadowBlur=22; }
    X.fillStyle=on?ACC:rgba(SKY,0.11);
    rr(x,cy-34,cw,68,16); X.fill(); nsh();
    if(!on){ X.strokeStyle=rgba(SKY,0.20); X.lineWidth=1.6; rr(x,cy-34,cw,68,16); X.stroke(); }
    T(d, x+cw/2, cy+11, FT(on?'value':'sub',26), on?CREAM:rgba(SKY,0.55));
    X.restore();
  });
  X.restore();
}

/* ㉞ نقاط قليلة على مدى طويل — «كيلواتك قليلة» */
function fewDots(cx,cy,w,filled,total,k,o){
  o=o||{};
  const gp=w/total, r=Math.min(gp*0.30,13);
  X.save();
  X.strokeStyle=rgba(SKY,0.18); X.lineWidth=2.5;
  X.beginPath(); X.moveTo(cx-w/2,cy); X.lineTo(cx+w/2,cy); X.stroke();
  for(let i=0;i<total;i++){
    const kk=eio(cl(pr(k,i*0.014,0.26+i*0.014),0,1)); if(kk<=0) continue;
    const on=i<filled, x=cx-w/2+gp/2+i*gp;
    X.save(); X.globalAlpha*=kk;
    if(on){X.shadowColor=rgba(ACC,0.9);X.shadowBlur=18;}
    X.fillStyle=on?ACC:rgba(SKY,0.16);
    X.beginPath(); X.arc(x,cy,on?r*1.25:r*0.62,0,7); X.fill(); nsh();
    X.restore();
  }
  X.restore();
}

/* ㉟ نبض ECG — سعة عالية تقول «نبضك مرتفع» */
function ecgLine(x,cy,w,amp,k,o){
  o=o||{}; const beats=o.beats||4, seg=w/beats;
  X.save();
  X.strokeStyle=rgba(SKY,0.16); X.lineWidth=2;
  X.beginPath(); X.moveTo(x,cy); X.lineTo(x+w,cy); X.stroke();
  const draw=cl(k,0,1)*w;
  X.save(); X.beginPath(); X.rect(x-4,cy-amp*1.5,draw+8,amp*3); X.clip();
  X.strokeStyle=ACC; X.lineWidth=5; X.lineJoin='round'; X.lineCap='round';
  X.shadowColor=rgba(ACC,0.60); X.shadowBlur=16;
  X.beginPath(); X.moveTo(x,cy);
  for(let b=0;b<beats;b++){
    const bx=x+b*seg;
    X.lineTo(bx+seg*0.30,cy);
    X.lineTo(bx+seg*0.38,cy+amp*0.22);
    X.lineTo(bx+seg*0.46,cy-amp);        /* القمة العالية */
    X.lineTo(bx+seg*0.54,cy+amp*0.42);
    X.lineTo(bx+seg*0.62,cy);
    X.lineTo(bx+seg,cy);
  }
  X.stroke(); nsh(); X.restore();
  /* رأس نابض */
  if(k>0.02&&k<1){
    X.fillStyle=WARM; X.beginPath(); X.arc(x+draw,cy,8,0,7); X.fill();
  }
  X.restore();
}

/* ㊱ شريط وتيرة بسيط */
function paceBar(x,cy,w,now,total,k){
  const seg=(w-16)/total;
  X.save();
  for(let c=0;c<total;c++){
    const kk=eio(cl(pr(k,c*0.05,0.30+c*0.05),0,1)); if(kk<=0) continue;
    X.save(); X.globalAlpha*=kk;
    X.fillStyle=c<now?ACC:rgba(SKY,0.13);
    rr(x+c*(seg+4), cy-13, seg, 26, 13); X.fill();
    X.restore();
  }
  X.restore();
}


/* ㊲ أيقونة + نصّ موسَّطان كوحدة — المحاذاة 'right' مع RTL تنزاح،
   فنستعمل 'center' لكل جزء ونحسب مركزه من عرض المجموعة. */
function iconText(cx,cy,icon,txt,font,col,icSize,gap){
  icSize=icSize||44; gap=gap||18;
  X.save(); X.font=font;
  const tw=X.measureText(txt).width, tot=tw+gap+icSize;
  /* عربي: النصّ يمين والأيقونة يساره */
  T(txt, cx + tot/2 - tw/2, cy+Math.round(parseInt(font)*0.0)+14, font, col);
  icon(cx - tot/2 + icSize/2, cy, icSize, col);
  X.restore();
  return tot;
}

/* ---------- master ---------- */
function draw(t){
  /* تصفير حالة الرسم بكل فريم — ضمانة إن أي فريم يبدأ نظيفاً */
  X.setTransform(1,0,0,1,0,0); X.globalAlpha=1; X.filter='none';
  X.shadowColor='transparent'; X.shadowBlur=0; X.shadowOffsetY=0; X.globalCompositeOperation='source-over';
  X.clearRect(0,0,W,H);X.fillStyle=BG;X.fillRect(0,0,W,H);
  /* ⛔ القاعدة 19: بدونها تطلع الخلفية مسطّحة ويلاحظها المستخدم فوراً.
     __noBG تطفيها للفواحص لأنها تقيس «كل ما ليس لون الخلفية» رسماً. */
  if(!window.__noBG) safe(liveBG,t,'bg');
  if(t<VEND){safe(drawVideo,t,'video');safe(behindText,t,'behind');/* glitch: سجّله بقائمة المشاهد لو احتجته — ما يشتغل تلقائياً */}
  if(!window.__diag){badge(t);bar(t);}
  /* ⛔ سجّل مشاهد هذا الفيديو هنا. الدوال فوق مكتبة أنماط — انسخ منها واكتب مشاهدك،
     ولا تشغّلها كما هي: توقيتاتها من فيديو ثانٍ فتطلع فوق وجهه وداخل الكابشن. */
  [].forEach(x=>safe(x[1],t,x[0]));
  if(!window.__diag){ safe(caption,t,'caption'); safe(outro,t,'outro'); }
  else { /* تشخيص: نحسب صندوق الكابشن بلا ما نرسمه */
    const c=CAPS.find(c=>t>=c.s&&t<c.e);
    if(c){const _ci=CAPS.indexOf(c),_ps=chunksFor(_ci,c.w);
      let _pi=0; for(let i=0;i<_ps.length;i++){ if(t>=_ps[i][0].s) _pi=i; }
      const F=fitCaption(_ps[_pi]),bh=F.L.length*F.lh+PADY*2,bw=Math.max(...F.L.map(l=>l.w))+PADX*2;
      window.__capBox={x:540-bw/2,y:1460-bh,w:bw,h:bh};} else window.__capBox=null; }
}
window.draw=draw;window.init=init;window.vrect=vrect;
window.__bleed=t=>false;   /* أعلن هنا اللحظات اللي صورة تحلّ فيها محل الفيديو ملء الكادر */
window.__boxes=()=>_TBOX;window.__resetBoxes=()=>{_TBOX=[];};
window.setFrame=src=>{ /* decode() بعد إسناد المصدر = ضمان إن هذي الصورة بالذات جاهزة */
  VF.src=src; return (VF.decode?VF.decode():Promise.resolve()).catch(()=>{}); };
/* q عدد = JPEG بتلك الجودة · q='png' = بلا خسارة (يشيل جيلاً كاملاً من فقد الكروما) */
window.shot=q=>document.getElementById('cv').toDataURL(
  q==='png'?'image/png':'image/jpeg', q==='png'?undefined:q);
